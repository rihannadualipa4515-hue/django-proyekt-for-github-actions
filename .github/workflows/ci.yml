name: Deploy to WPS

on:
  push:
    branches: [ "main" ]

jobs:
  connect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Check/Install Python and Deploy Project
        run: |
          export SSHPASS="Tur57RMSFg3s"

          # 1. Serwerde Python barlagy we bukja döretmek
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            root@153.75.82.12 << 'EOF'

            echo "Connected to VPS successfully!"
            if command -v python3 > /dev/null 2>&1; then
              echo "Python is already installed!"
              python3 --version
            else
              apt-get update
              apt-get install -y python3 python3-pip python3-venv
            fi

            mkdir -p ~/CI-test
          EOF

          # 2. Proýekti çalt we howpsuz göçürmek (gereksiz venv/cache aýryldy)
          sshpass -e rsync -avz --delete \
            -e "ssh -p 22 -o StrictHostKeyChecking=accept-new" \
            --exclude 'venv/' \
            --exclude '.git/' \
            --exclude '__pycache__/' \
            ./ root@153.75.82.12:~/CI-test/

          # 3. Barlag
          sshpass -e ssh \
            -p 22 \
            root@153.75.82.12 \
            "ls -la ~/CI-test"