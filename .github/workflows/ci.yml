name: My first CI

on: push

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Connect to VPS
        run: |
          export SSHPASS=${{ secrets.VPS_PASS }}

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} \
            "whoami && hostname && uptime && mkdir -p ~/CI-test"

          sshpass -e scp \
            -P ${{ secrets.VPS_PORT }} \
            -r \
            -o StrictHostKeyChecking=accept-new \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:~/CI-test/

          sshpass -e ssh \
            -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} \
            "ls -la ~/CI-test"