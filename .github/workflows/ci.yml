name: Deploy to WPS

on:
  push:
    branches: [ "main" ]

jobs:
  connect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Connect and Copy to VPS
        run: |
          export SSHPASS="ZDTEPMqLXV93"

          # 1. Serwerde barmaly bukja döretmek we birikmäni barlamak
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            root@45.61.176.113 \
            "mkdir -p ~/CI-test && whoami && uptime"

          # 2. Proýektiňizi serwere göçürmek
          sshpass -e scp \
            -P 22 \
            -r \
            -o StrictHostKeyChecking=accept-new \
            ./ root@45.61.176.113:~/CI-test/

          # 3. Serwerde faýllaryň barlanandygyny barlamak
          sshpass -e ssh \
            -p 22 \
            root@45.61.176.113 \
            "ls -la ~/CI-test"